<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lectores · Biblioteca Solón Argüello</title>
  <link rel="icon" href="/img/favicon.png">
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <div class="panel">
    <aside class="lateral" id="lateral" aria-label="Menú del personal"></aside>
    <main class="principal">
      <div class="cabecera">
        <div>
          <button class="btn btn-chico menu-movil" id="abrir-menu" aria-label="Abrir menú">Menú</button>
          <h1>Lectores</h1>
          <div class="sub">CRUD del padrón y credenciales de préstamo · Pantalla de Víctor Alberto Ibarra García</div>
        </div>
        <button class="btn btn-primario" id="nuevo">+ Nuevo lector</button>
      </div>

      <div class="stats">
        <div class="stat"><div class="etq">Credenciales activas</div><div class="num" data-k="Activa">—</div></div>
        <div class="stat"><div class="etq">Vencidas</div><div class="num" data-k="Vencida">—</div></div>
        <div class="stat alerta"><div class="etq">Suspendidas</div><div class="num" data-k="Suspendida">—</div></div>
        <div class="stat"><div class="etq">Vencen en 30 días</div><div class="num" data-k="porVencer">—</div></div>
      </div>

      <div class="filtros">
        <label class="sr" for="buscar">Buscar</label>
        <input class="input" id="buscar" type="search" placeholder="Buscar por nombre, credencial, teléfono o correo">
        <label class="sr" for="f-situacion">Situación</label>
        <select class="input" id="f-situacion">
          <option value="">Todas las situaciones</option>
          <option>Activa</option><option>Vencida</option><option>Suspendida</option><option>Cancelada</option>
        </select>
      </div>

      <div class="tabla-caja">
        <table>
          <thead><tr><th>Lector</th><th>Tipo</th><th>Contacto</th><th>Vigencia</th><th class="num">Préstamos</th><th>Situación</th><th>Acciones</th></tr></thead>
          <tbody id="filas"><tr><td colspan="7" class="vacio">Cargando…</td></tr></tbody>
        </table>
      </div>
      <div class="paginacion" id="paginacion"></div>
    </main>
  </div>
  <script type="module" src="/js/lectores.js"></script>
</body>
</html>
